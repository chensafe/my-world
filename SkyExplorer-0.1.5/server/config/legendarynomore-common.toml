#Per-boss protection switches for Legendary Monsters 2.2.2.
[bosses]

	[bosses.cloud_golem]
		#Keep this mob's bonus damage based on the victim's maximum health, including its projectiles and summoned attacks. Off removes only that bonus; base damage, actual maximum health and healing are unchanged.
		max_health_damage = true
		#Keep this boss's per-hit damage cap.
		damage_cap = false
		#Keep this boss's automatic healing without a target. Legendary Monsters' AllowBossNatureHeal must also be enabled. Does not affect potion or combat ability healing.
		out_of_combat_healing = true
		#Reject damage while the target is too far above or below this boss.
		height_protection = false
		#Keep this boss's immunity to potion and status effects.
		effect_immunity = false
		#Clear all of the Cloud Golem's own status effects every tick, independently of effect immunity.
		effect_clearing = false
		#Keep the boss-specific repeated-hit damage reduction.
		adaptive_damage_reduction = false
		#Keep this boss's projectile immunity or projectile counter.
		projectile_immunity = false
		#Reject damage when the target is too far away from this boss.
		distance_protection = false
		#Keep the extra boss-specific post-hit invulnerability window.
		custom_invulnerability_frames = false

		[bosses.cloud_golem.combat]
			#Make non-laser Cloud Golem damage respect armor. Off retains original damage-type behavior.
			non_laser_respects_armor = true
			#Cloud Golem lasers bypass armor. Off makes lasers respect armor, independently of the non-laser switch.
			laser_ignores_armor = true
			#Allow shields facing the Cloud Golem laser to block it, independently of armor penetration.
			laser_shield_blocking = true
			#Use a box for charge contact and damage. Off restores the original distance/sector checks.
			charge_collision_hitbox = true
			#Double charge box width, height and depth around its center. Requires charge_collision_hitbox; off uses the golem's own collision box. Does not resize the entity.
			double_charge_hitbox = true
			#Halve horizontal and vertical laser tracking speeds. Off restores original tracking speeds.
			slow_laser_tracking = true
			#Interrupt each laser cast when cumulative actual health lost exceeds 10% of maximum health. Removes that caster's beam and stuns it for 65 ticks (3.25 seconds). Damage resets between casts; blocked/absorbed damage does not count.
			laser_damage_stun = true

