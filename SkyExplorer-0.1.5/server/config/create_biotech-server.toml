[experiencePump]
	#Allow an open experience pump input to drain experience from players.
	allowPlayerXpDrain = true
	#Allow an open experience pump input to drain and attract experience orbs.
	allowOrbDrain = true
	#Allow experience pumps to consume supported experience items from inventories.
	allowItemXpDrain = true
	#Maximum experience points transferred by one pump per tick. 0 keeps the RPM-derived rate unlimited.
	# Default: 0
	# Range: > 0
	maxTransferPerTick = 0
	#Experience-orb attraction radius, in blocks, for an input nozzle at 256 RPM.
	# Default: 16.5
	# Range: 0.0 ~ 128.0
	nozzleAttractionRangeAt256Rpm = 16.5
	#Convert experience fluid leaving open pipe ends back into experience orbs.
	emitOrbsFromOpenPipes = true

[bioPackager]
	#Allow moving bio-packagers to replace a contraption's lethal mob hit with capture.
	enableContraptionLethalCapture = true
	#Duration of one bio-packager tray movement. Values below 6 are invalid for its animation curve.
	# Default: 20
	# Range: 6 ~ 1200
	cycleTicks = 20

[shulkerTeleporter]
	allowCrossDimension = true
	#Allow static-world destinations to load their chunk while resolving a teleport.
	allowDestinationChunkLoading = true
	#Maximum destination distance within the same dimension and sublevel. 0 means unlimited.
	# Default: 0.0
	# Range: 0.0 ~ 3.0E7
	maxSameSpaceDistance = 0.0
	allowPlayers = true
	allowMobs = true
	allowItems = true
	#Maximum entities moved in one activation. 0 means unlimited.
	# Default: 0
	# Range: 0 ~ 1024
	maxEntitiesPerTeleport = 0
	# Default: 80
	# Range: > 0
	arrivalCooldownTicks = 80

[teleportationFluid]
	#Expose nether portal blocks as sources of teleportation fluid.
	enablePortalExtraction = true
	#Teleportation fluid available from each nether portal block, in millibuckets.
	# Default: 250
	# Range: > 1
	fluidPerPortalBlock = 250
	#Destroy a portal block after all of its configured teleportation fluid is extracted.
	destroyPortalBlockWhenDrained = true

[allayCourier]
	allowCrossDimensionDelivery = true
	#Maximum same-space delivery distance, in blocks. 0 means unlimited.
	# Default: 0.0
	# Range: 0.0 ~ 3.0E7
	maxDeliveryDistance = 0.0
	#Maximum active courier tasks on the server. 0 means unlimited.
	# Default: 0
	# Range: 0 ~ 1000000
	maxActiveTasks = 0
	#Maximum active tasks launched by one player. 0 means unlimited; port-launched tasks are not counted here.
	# Default: 0
	# Range: 0 ~ 1000000
	maxActiveTasksPerPlayer = 0
	#Ticks before a courier may relocate near a distant or cross-dimensional target.
	# Default: 300
	# Range: > 0
	teleportAfterTicks = 300
	#Ticks before a courier forces delivery recovery. Effectively never less than teleportAfterTicks.
	# Default: 600
	# Range: > 0
	forceArrivalTicks = 600
	#Ticks a port keeps retrying a queued carrier return before applying its existing fallback.
	# Default: 100
	# Range: > 1
	returnRetryTicks = 100
	#Delay before a received carrier launches its return trip.
	# Default: 40
	# Range: > 0
	returnLaunchDelayTicks = 40

