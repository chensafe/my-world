#允许所有普通玩家访问游戏库；false 时仅授权 UUID 名单。具体选用与上传权限由各自开关控制，不授予全局管理或任意下载。
allowAllPlayers = true
#允许有游戏库访问权的普通玩家上传 ROM。默认关闭；OP2 不受此限制。
allowPlayerRomUploads = false
#允许有游戏库访问权的普通玩家上传 PNG 封面。与 ROM 上传独立，默认关闭。
allowPlayerCoverUploads = false
#授权玩家可选服务器已有ROM配置自己的卡带或空闲街机；兼容旧名单权限，仍须allowAllPlayers或名单准入。
allowServerRomUse = true
#授权玩家可选择服务器已有PNG封面；不授予上传权限。默认关闭。
allowServerCoverUse = false
authorizedPlayers = []
