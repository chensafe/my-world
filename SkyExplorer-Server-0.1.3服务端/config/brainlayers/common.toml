[cockroach]
	#Whether cockroaches can spawn from dying zombies.
	enabled = false
	#Chance for a dying zombie to spawn a cockroach. 0.02 means 2%.
	# Default: 0.02
	# Range: 0.0 ~ 1.0
	zombie_spawn_chance = 0.02

[urea_bag]
	#Whether newly spawned zombies can carry urea bags.
	zombie_enabled = false
	#Chance for a newly spawned zombie to carry a urea bag. 0.03 means 3%.
	# Default: 0.03
	# Range: 0.0 ~ 1.0
	zombie_spawn_chance = 0.03
	#Whether zombie-carried urea bags can contain a primed TNT surprise.
	zombie_tnt_enabled = true

[pillow]
	#Whether sleeping on a pillow block saves the player's respawn point.
	sleep_sets_spawn = false
	#Chance to get stiff neck after sleeping on a pillow block. 0.25 means 25%.
	# Default: 0.25
	# Range: 0.0 ~ 1.0
	stiff_neck_chance = 0.25
	#Whether violent head movement while stiff-necked can increase the stiff neck level.
	stiff_neck_level_up_enabled = true
	#Chance per painful fast turn to increase stiff neck level. 0.12 means 12%.
	# Default: 0.12
	# Range: 0.0 ~ 1.0
	stiff_neck_level_up_chance = 0.12
	#Ticks near heat needed to reduce stiff neck by one level.
	# Default: 100
	# Range: 20 ~ 1200
	stiff_neck_heat_ticks_per_level = 100

[leather_whip]
	#Leather whip sweep range in blocks.
	# Default: 2.75
	# Range: 1.0 ~ 8.0
	sweep_range = 2.75
	#Leather whip total sweep angle in degrees.
	# Default: 70.0
	# Range: 10.0 ~ 180.0
	sweep_angle_degrees = 70.0

[copper_belt]
	#Maximum top energy charged by the copper belt.
	# Default: 6.0
	# Range: 1.0 ~ 30.0
	top_max_energy = 6.0

[school_desk]
	#Base chance for fortune enchanted books on a school desk to duplicate furnace/brewing outputs. 0.025 means 2.5%.
	# Default: 0.025
	# Range: 0.0 ~ 1.0
	fortune_extra_output_base_chance = 0.025
	#Additional chance per fortune level for school desk extra outputs. 0.01 means +1% per level.
	# Default: 0.01
	# Range: 0.0 ~ 1.0
	fortune_extra_output_chance_per_level = 0.01
	#Chance to get numb hand after a successful desk sleep without a pillow on that desk. 0.20 means 20%.
	# Default: 0.2
	# Range: 0.0 ~ 1.0
	numb_hand_chance_without_pillow = 0.2
	#Duration in ticks of numb hand caused by sleeping on a desk without a pillow. 600 means 30 seconds.
	# Default: 600
	# Range: 1 ~ 36000
	numb_hand_duration_ticks = 600
	#Whether using an item to set a school-desk alarm tone plays a short preview sound.
	alarm_tone_preview = true

[advanced_composter]
	#Whether village farm composters can be replaced with advanced composters in new chunks.
	village_replacement_enabled = true
	#Chance for a village farm composter to become an advanced composter. 0.25 means 25%.
	# Default: 0.25
	# Range: 0.0 ~ 1.0
	village_replacement_chance = 0.25
