[general]
	#图片保存路径。
	#支持绝对路径，或相对于游戏根目录的相对路径。
	savePath = "item_icon_exporter_output"
	#要导出的图片尺寸列表（填入整数即可，代表正方形边长）。
	#最小尺寸: 16  |  最大尺寸: 2048
	imageSizes = [36, 168]
	#导出带领附魔光效的物品时的处理策略。
	#1 = 仅导出非附魔图标（默认，自动剥离发光表现）。
	#2 = 仅导出附魔图标（保留原本的发光表现）。
	#3 = 同时导出两种（导出一张无光效的原图，和一张带 '_glint' 后缀图）。
	# Default: 1
	# Range: 1 ~ 3
	glintExportMode = 1
	#是否启用快捷键导出（修改后需重启游戏）。如果想纯靠指令导出，可以关闭此项避免误触。
	enableKeybindings = true
	#批量导出时每游戏刻（帧）最多处理的物品数量。数值越小游戏越流畅，越大导出越快。
	# Default: 10
	# Range: 1 ~ 100
	maxExportsPerTick = 10
