[physics]
	#Gravity per tick in blocks/tick^2, used when the bound cannon has no shell to read.
	#CBC default = 0.05
	# Default: 0.05
	# Range: 0.001 ~ 10.0
	gravity = 0.05
	#Velocity retained per tick, used when the bound cannon has no shell to read.
	#CBC default = 0.99, i.e. a drag coefficient of 0.01
	# Default: 0.99
	# Range: 0.01 ~ 1.0
	drag = 0.99
