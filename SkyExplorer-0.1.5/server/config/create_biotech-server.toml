	#World-space placement/repair radius and distance where stretching begins, in blocks.
	# Default: 4.675
	# Range: 0.0 ~ 128.0
	strainStartDistance = 4.675
	#World-space distance that breaks an overstretched joint, in blocks.
	# Default: 5.5
	# Range: 0.01 ~ 128.0
	disconnectDistance = 5.5
	#Maximum spring force reached at the disconnect distance.
	# Default: 8192.0
	# Range: 0.0 ~ 1000000.0
	peakTension = 8192.0
	#Radial damping force per block/second of relative endpoint speed.
	# Default: 320.0
	# Range: 0.0 ~ 100000.0
	separationDamping = 320.0
	#Directionless Sable air-drag coefficient contributed by each joint endpoint block. Sable scales it by local air pressure and physics timestep.
	# Default: 0.75
	# Range: 0.0 ~ 16.0
	endpointAirDrag = 0.75
	#Maximum elastic impulse applied to either structure in one physics step.
	# Default: 1024.0
	# Range: 0.01 ~ 1000000.0
	maxImpulse = 1024.0
	#Per-axis player movement multiplier while intersecting the slime shaft. Use 1.0 to disable the slowdown; lower values apply stronger slowdown.
