#是否在 JEI 展示原先隐藏的地狱配方；只影响展示，不禁用配方。
show_hell_recipes = true
#野生猫是否使用原版避人/受伤逃跑 AI。默认关闭；不影响词条特殊行为。
wild_cats_flee = false
#猫咪是否哈气。关闭会停止哈气姿势、配对音效及哈气产出，不停止物流运输。
cats_hiss = true
#猫咪死亡变成猫饼时，是否随机扣除一项基础属性。默认开启；不改变属性上限。
#适用于所有死亡后生成猫饼的宠物猫和职业猫；不改变词条独立效果或蟑螂分裂继承。
cat_death_attribute_penalty_enabled = true
#每次死亡随机一项基础属性的固定扣除点数，最低扣到0；不是百分比，也不是六项全扣。
#默认20；0等同于不扣除。关闭死亡扣属性开关时此数值不生效。
# Default: 20
# Range: > 0
cat_death_attribute_loss = 20
