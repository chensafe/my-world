	[mobs.ambusher]
		#Keep this mob's bonus damage based on the victim's maximum health, including its projectiles and summoned attacks. Off removes only that bonus; base damage, actual maximum health and healing are unchanged.
		max_health_damage = true
		#Limit Ambusher's attack-start distance and melee hit radius to 3 blocks. Off restores the original 3.5-block start distance and 4-block hit radius. Applies to existing mobs.
		short_attack_range = true
		#Keep Ambusher's arrow and trident immunity. This switch replaces upstream Ambushprojectile. Off allows those hits through normal damage handling. Other ranged attacks and fall immunity are unchanged; independent of ranged_retaliation.
		projectile_immunity = false
		#Keep Ambusher retaliation against projectile and indirect damage. Off leaves melee retaliation unchanged.
		ranged_retaliation = false

	[mobs.dune_sentinel]
		#Keep this mob's bonus damage based on the victim's maximum health, including its projectiles and summoned attacks. Off removes only that bonus; base damage, actual maximum health and healing are unchanged.
		max_health_damage = true
		#Keep Dune Sentinel's arrow, trident and MOB_PROJECTILE immunity. Replaces upstream Duneprojectile; off restores normal damage handling. Fire, fall and explosion immunity remain unchanged.
		projectile_immunity = false
		#Keep Dune Sentinel's forced immunity to knockback and pushing. Off restores vanilla knockback and collision pushing, ignoring its built-in knockback resistance during knockback only. Does not change saved attributes, walking speed or attack AI.
		knockback_immunity = true
		#Allow Dune Sentinel's bombs to destroy blocks, subject to mobGriefing and explosion protection events. Off preserves blocks. Explosion strength, entity damage and knockback are unchanged; bombs from other owners keep their original behavior.
		bomb_block_destruction = false
		#Keep camera shake from bombs owned by Dune Sentinel. Off only removes this shake; explosion damage, knockback, sound and particles remain. Other owners and other camera shakes are unchanged.
		bomb_camera_shake = false

