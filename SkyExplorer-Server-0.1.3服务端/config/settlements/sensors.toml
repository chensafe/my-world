[block_resources]
	#Horizontal radius in blocks for shared block resource scans
	# Default: 32
	# Range: 1 ~ 1024
	scan_range_horizontal = 32
	#Vertical radius in blocks for shared block resource scans
	# Default: 8
	# Range: 0 ~ 128
	scan_range_vertical = 8
	#How often shared block resource scans run
	# Default: 30
	# Range: 5 ~ 900
	scan_interval_seconds = 30
	#Maximum block-resource sections scanned per level tick
	# Default: 8
	# Range: 1 ~ 128
	scan_budget_sections_per_tick = 8

[demanded_ground_item]
	#How often each villager scans for nearby demanded ground items (in seconds)
	# Default: 10
	# Range: 1 ~ 300
	scan_interval_seconds = 10

[entity_perception]
	#Horizontal radius in blocks for shared nearby entity perception scans
	# Default: 32
	# Range: 1 ~ 256
	scan_range_horizontal = 32
	#Vertical radius in blocks for shared nearby entity perception scans
	# Default: 16
	# Range: 0 ~ 64
	scan_range_vertical = 16
	#How often shared nearby entity perception scans run
	# Default: 10
	# Range: 1 ~ 300
	scan_interval_seconds = 10
