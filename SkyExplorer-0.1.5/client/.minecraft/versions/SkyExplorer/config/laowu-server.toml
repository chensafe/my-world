#已驯养猫死亡处理：0=不生成猫饼（物品栏和饰品正常掉落），1=掉落猫饼物品，2=转变为猫饼生物。
#默认1。后两项保留主人与随身物品，并使用死亡属性设置；遵守doMobLoot，蟑螂分裂优先。
# Default: 1
# Range: 0 ~ 2
cat_death_outcome = 1

#世界/服务器配置。游戏内按 V -> 世界设置；仅 OP 等级2及以上或单人世界主人可修改。
#倍率只缩放实际能力公式中的属性输入，不修改基础属性、培养上限或遗传数据。
#1=默认，0=仅保留公式固定项；范围0~999999。套装固定生命/护甲/韧性加成不缩放。
[attribute_multipliers]
	# Default: 1.0
	# Range: 0.0 ~ 999999.0
	attack = 5.0
	# Default: 1.0
	# Range: 0.0 ~ 999999.0
	health = 1.0
	# Default: 1.0
	# Range: 0.0 ~ 999999.0
	speed = 1.0
	# Default: 1.0
	# Range: 0.0 ~ 999999.0
	stamina = 1.0
	# Default: 1.0
	# Range: 0.0 ~ 999999.0
	intelligence = 1.0
	# Default: 1.0
	# Range: 0.0 ~ 999999.0
	luck = 1.0

#职业套装公式系数K：伤害=(2+0.08×战斗力属性×战斗力倍率)×K，范围0~999999。
#直接替换原套装系数，不再额外相乘。默认：机械0.75、钓鱼0.55、飞行2、喷火0.75、采蜜1.2、物流0、雷管1.5、工程3、医疗0、音乐0。
#辅助猫不会攻击。原版生命、护甲等生物属性上限仍然适用。
[career_damage_coefficients]
	#机械套装；套装默认系数 K = 0.75
	# Default: 0.75
	# Range: 0.0 ~ 999999.0
	terminator = 3.0
	#钓鱼套装；套装默认系数 K = 0.55
	# Default: 0.55
	# Range: 0.0 ~ 999999.0
