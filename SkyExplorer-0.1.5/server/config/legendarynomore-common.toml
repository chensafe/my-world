		[bosses.the_obliterator.combat]
			#Allow front-facing shields to block The Obliterator's lasers without disabling the shield. Normal durability cost applies. Off restores original behavior.
			laser_shield_blocking = true
			#Allow shields facing The Obliterator's large, split and tracking bombs to block them without shield cooldown or the blocked hit's Annihilation effect. Normal durability cost and bomb splitting remain. Off restores original behavior.
			bomb_shield_blocking = true

